<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${productDto.id} != null ? 'Редактировать товар' : 'Новый товар'"></title>
</head>

<body>
<div layout:fragment="content" class="col-md-6 offset-md-3">
    <h3 th:text="${productDto.id} != null ? 'Редактировать товар' : 'Добавить товар'"></h3>
    <form th:action="@{${formAction}}" th:object="${productDto}" method="post">
        <div class="mb-3">
            <label class="form-label">Название</label>
            <input class="form-control" th:field="*{name}" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Описание</label>
            <textarea class="form-control" th:field="*{description}"></textarea>
        </div>
        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Цена</label>
                <input class="form-control" type="number" step="0.01" th:field="*{price}" required/>
            </div>
            <div class="col">
                <label class="form-label">Остаток</label>
                <input class="form-control" type="number" th:field="*{stockQty}" required/>
            </div>
        </div>
        <button class="btn btn-success" type="submit">Сохранить</button>
    </form>
</div>
</body>
</html>
