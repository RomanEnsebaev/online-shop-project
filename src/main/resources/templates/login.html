<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title layout:fragment="title">Login</title></head>
<body>
<div layout:fragment="content" class="col-md-4 offset-md-4">
    <h3 class="text-center mb-3">Login</h3>

    <div class="alert alert-success" th:if="${msg}" th:text="${msg}"></div>
    <div class="alert alert-danger"  th:if="${param.error}">Invalid credentials</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control" type="text" name="username" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" required/>
        </div>
        <button class="btn btn-primary w-100">Log in</button>
    </form>

    <div class="text-center mt-3">
        <a th:href="@{/register}">New user? Register</a>
    </div>
</div>
</body>
</html>
