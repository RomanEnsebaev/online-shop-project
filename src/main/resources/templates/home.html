<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Каталог</title></head>
<body>
<div layout:fragment="content">
    <h2 class="mb-4">Каталог товаров</h2>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="p : ${products}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.name}">Название</h5>
                    <p class="card-text" th:text="${p.description}">описание</p>
                </div>
                <div class="card-footer d-flex justify-content-between align-items-center">
                    <span class="fw-bold" th:text="${#numbers.formatDecimal(p.price,0,'POINT',2,'COMMA')}">0.00</span>
                    <button class="btn btn-sm btn-primary" disabled>В корзину</button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
