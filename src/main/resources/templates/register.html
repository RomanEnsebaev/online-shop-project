<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title layout:fragment="title" th:text="#{register.title}">Регистрация</title></head>
<body>
<div layout:fragment="content" class="col-md-4 offset-md-4">
    <h3 class="text-center mb-3" th:text="#{register.header}">Создать аккаунт</h3>

    <form th:action="@{/register}" th:object="${dto}" method="post">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="mb-3">
            <label class="form-label" th:text="#{register.label.username}">Логин</label>
            <input class="form-control" th:field="*{username}" required/>
        </div>
        <div class="mb-3">
            <label class="form-label" th:text="#{register.label.password}">Пароль</label>
            <input class="form-control" type="password" th:field="*{password}" required/>
        </div>
        <div class="mb-3">
            <label class="form-label" th:text="#{register.label.confirmPassword}">Подтвердите пароль</label>
            <input class="form-control" type="password" th:field="*{confirmPassword}" required/>
        </div>
        <button class="btn btn-success w-100" th:text="#{register.button.register}">Зарегистрироваться</button>
    </form>

    <div class="text-center mt-3">
        <a th:href="@{/login}" th:text="#{register.link.login}">Уже есть аккаунт? Войти</a>
    </div>
</div>
</body>
</html>
