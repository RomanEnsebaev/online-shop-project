<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title layout:fragment="title">Register</title></head>
<body>
<div layout:fragment="content" class="col-md-4 offset-md-4">
    <h3 class="text-center mb-3">Create account</h3>

    <form th:action="@{/register}" th:object="${dto}" method="post">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control" th:field="*{username}" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" th:field="*{password}" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Confirm password</label>
            <input class="form-control" type="password" th:field="*{confirmPassword}" required/>
        </div>
        <button class="btn btn-success w-100">Register</button>
    </form>

    <div class="text-center mt-3">
        <a th:href="@{/login}">Already have an account? Sign in</a>
    </div>
</div>
</body>
</html>
